name: Update profile assets

on:
  schedule:
    - cron: '23 18 * * *' # 北京时间次日 02:23；避开整点
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-profile.yml'

permissions:
  contents: read

concurrency:
  group: profile-assets-${{ github.repository }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: main
          fetch-depth: 1

      # 此缓存保存上一次有效 SVG，用于恢复；不是依赖或 API 响应缓存。
      - name: Restore last-known-good assets
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/profile-last-good
          key: profile-svg-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            profile-svg-v1-${{ github.repository_id }}-

      - name: Snapshot tracked assets
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/profile-last-good"
          mkdir -p "$backup"
          for dir in profile-3d-contrib dist; do
            if [ -d "$dir" ]; then
              mkdir -p "$backup/$dir"
              cp -a "$dir/." "$backup/$dir/"
            fi
          done

      - name: Generate contribution city
        id: city
        continue-on-error: true
        timeout-minutes: 8
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3 # main snapshot, Node 24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 根入口使用 Docker；不使用旧 node16 的 svg-only 入口。
      - name: Generate contribution snake
        id: snake
        continue-on-error: true
        timeout-minutes: 5
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3, Docker
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Validate SVGs and restore failed components
        id: validate
        env:
          CITY_OUTCOME: ${{ steps.city.outcome }}
          SNAKE_OUTCOME: ${{ steps.snake.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          backup = Path(os.environ['RUNNER_TEMP']) / 'profile-last-good'
          groups = [
              ('profile-3d-contrib', os.environ['CITY_OUTCOME'],
               ['profile-green.svg', 'profile-night-rainbow.svg']),
              ('dist', os.environ['SNAKE_OUTCOME'],
               ['github-contribution-grid-snake.svg', 'github-contribution-grid-snake-dark.svg']),
          ]
          failed = []
          def valid(path):
              try:
                  return ET.parse(path).getroot().tag == '{http://www.w3.org/2000/svg}svg'
              except (OSError, ET.ParseError):
                  return False

          for directory, outcome, names in groups:
              target = Path(directory)
              good = outcome == 'success' and all(valid(target / n) for n in names)
              if not good:
                  failed.append(directory)
                  print(f'::warning::{directory}: generation failed; restoring previous assets')
                  # 工作区仅为临时 checkout；清除该生成器的部分结果。
                  if target.exists():
                      shutil.rmtree(target)
                  subprocess.run(['git', 'restore', '--source=HEAD', '--worktree', '--', directory],
                                 check=False)
                  saved = backup / directory
                  if saved.exists():
                      for name in names:
                          if not valid(target / name) and valid(saved / name):
                              target.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(saved / name, target / name)
              if all(valid(target / n) for n in names):
                  shutil.copytree(target, backup / directory, dirs_exist_ok=True)
              else:
                  print(f'::error::{directory}: no complete valid fallback is available')
                  if directory not in failed:
                      failed.append(directory)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"failed={'true' if failed else 'false'}\n")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('Profile assets: ' + ('degraded: ' + ', '.join(failed) if failed else 'updated and validated') + '\n')
          PY

      - name: Commit valid assets and push with bounded retry
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for dir in profile-3d-contrib dist; do
            if [ -d "$dir" ]; then git add -- "$dir"; fi
          done
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'chore(profile): refresh contribution assets [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then break; fi
            sleep "$((attempt * 5))"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo '::error::Concurrent edits conflict with generated assets; rerun after resolving.'
              exit 1
            fi
          done
          echo '::error::Push failed after three attempts.'
          exit 1

      - name: Save last-known-good assets
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5, Node 24
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/profile-last-good
          key: profile-svg-v1-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}

      # 保存有效副本后，让生成失败保持可见。
      - name: Report generation failure
        if: steps.validate.outputs.failed == 'true'
        run: |
          echo '::error::One or more generators failed. Previous valid assets were retained where available.'
          exit 1
